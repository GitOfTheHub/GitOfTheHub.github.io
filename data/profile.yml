bio_paragraph: |
  Harjoat Bhamra is Professor of Finance at Imperial College Business School,
  a CEPR Research Fellow, and a Fellow of the National Institute of Economic
  and Social Research (NIESR). His research spans asset pricing theory,
  credit risk, monetary policy, household finance, and macro-finance, with
  publications in the *Review of Financial Studies*, *American Economic
  Review*, *Journal of Economic Theory*, and the *Journal of Monetary
  Economics*. He received his PhD in Finance from London Business School in
  2003. Before LBS he read Mathematics
  at St. John's College, Cambridge, including Part III of the Mathematical
  Tripos, and spent 1996–97 as an interest-rate derivatives trader at First
  National Bank of Chicago in London prior to entering academia.

