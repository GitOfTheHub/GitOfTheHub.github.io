# Publications — single source of truth for website and CV.
#
# Schema:
#   id              — slug (used as anchor; keep stable across revisions)
#   title           — full title (preserve stylization e.g. "AND" capitalization)
#   authors         — list in citation order (alphabetical by surname in economics convention)
#   year            — print volume year for published; current revision year for working papers
#   journal         — only for published papers (name, abbrev, volume, issue, pages)
#   status          — for non-published: "rr_at" (Revise & Resubmit) | "working" | "in_progress"
#   doi             — Crossref DOI
#   ssrn_id         — SSRN abstract ID (numeric)
#   links           — explicit URLs (publisher, ssrn, pdf, etc.)
#   awards          — list of awards with name + year + venue
#   presentations   — list of {venue, year} for working papers (drives CV "[Presented at ...]" line)
#   notes           — free text (e.g. "lead article")
#   skip_website    — set true to keep on CV only (e.g. paper not yet on SSRN)
#
# Sections below: published, under_review, working, in_progress.

