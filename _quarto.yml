project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"           # render only Quarto pages — keeps internal *.md docs out of the build
  preview:
    watch-inputs: true  # also watch data/*.yml and _helpers.py so edits trigger rebuilds

website:
  title: "Harjoat S. Bhamra"
  description: "Professor of Finance, Imperial College Business School"
  site-url: https://harjoatbhamra.com
  page-navigation: true

  navbar:
    background: light
    pinned: true
    left:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - href: discussions.qmd
        text: Discussions
      - href: teaching.qmd
        text: Teaching
      - href: about.qmd
        text: About
      - href: cv.qmd
        text: CV
    right:
      - icon: mortarboard-fill
        href: https://scholar.google.com/citations?user=9zB2ZbgAAAAJ
        aria-label: Google Scholar
      - icon: book
        href: https://papers.ssrn.com/sol3/cf_dev/AbsByAuth.cfm?per_id=327262
        aria-label: SSRN
      - icon: linkedin
        href: https://www.linkedin.com/in/harjoat
        aria-label: LinkedIn
      - icon: twitter
        href: https://twitter.com/harjoatbhamra
        aria-label: Twitter

  page-footer:
    left: |
      &copy; 2026 Harjoat S. Bhamra
    right: |
      Built with [Quarto](https://quarto.org). [Source](https://github.com/GitOfTheHub/GitOfTheHub.github.io).

format:
  html:
    theme:
      - cosmo
      - styles.scss
    css: extras.css
    toc: true
    toc-location: right
    toc-depth: 3
    grid:
      sidebar-width: 250px
      body-width: 900px
      margin-width: 250px
    link-external-newwindow: true
    link-external-icon: true
    mainfont: "Source Sans 3, -apple-system, system-ui, sans-serif"
    monofont: "JetBrains Mono, ui-monospace, monospace"
    fontsize: "1.05em"
    linestretch: 1.55
    code-copy: true

execute:
  echo: false
  warning: false
  freeze: false     # always re-execute so YAML data changes are picked up
